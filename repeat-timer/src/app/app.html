<h1>Repeat Timer</h1>

<div style="margin-bottom: 16px;">
  <label for="time">Duration (seconds): </label>
  <input id="time"
         type="number"
         [(ngModel)]="timeInput"
         min="1" />
</div>

<div style="margin-bottom: 20px;">
  <h2>{{ format(remaining) }}</h2>
</div>

<div style="display: flex; gap: 10px;">
  <button (click)="start()" [disabled]="isRunning">
    Start
  </button>

  <button (click)="next()" [disabled]="remaining !== 0">
    Next
  </button>

  <button (click)="done()">
    Done
  </button>
</div>
